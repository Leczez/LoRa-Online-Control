[package]
name = "lora-server"
# Cargo requires a value here, but it isn't what's embedded in the binary or
# shown on /status.json — that comes from the repo-root VERSION file
# (read by build.rs) so it can't drift from what `cat VERSION` reports.
version = "0.1.0"
edition = "2021"

[dependencies]
sx127x = { path = "../sx127x" }
anyhow = "1"
heapless = "0.8"
# lora-tui's displayed log timestamps (ui.rs::timestamp) — std deliberately
# has no timezone support of its own, and chrono's Local::now() is the
# standard, thread-safe way to get the system's actual local time instead
# of hand-rolling UTC-only arithmetic.
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.28"
crossterm = "0.28"
serialport = "4"
embedded-hal = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

# Bare SX1276/RFM95W over SPI+GPIO is the only supported radio transport now
# (E22/UART support dropped), which means lora-server needs Pi GPIO access
# unconditionally rather than as an opt-in "rpi" feature.
[target.'cfg(target_os = "linux")'.dependencies]
rppal = { version = "0.19", features = ["embedded-hal"] }
udev = { version = "0.9", features = ["send"] }
libc = "0.2"
