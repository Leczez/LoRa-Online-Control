[package]
name = "esp32-node"
# Cargo requires a value here, but it isn't what's embedded in the binary or
# logged on boot — that comes from the repo-root VERSION file (read by
# build.rs) so it can't drift from what `cat VERSION` reports.
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.77"

# Kept out of the workspace at the repo root: this crate builds against the
# Xtensa/esp-idf toolchain (espup), a different compiler entirely from the
# rest of the workspace (sx127x/lora-server/roc-server, all plain
# rustc/rustup targets). Declaring [workspace] here marks this directory as
# its own workspace root so Cargo doesn't try to fold it into the parent's.
[workspace]
members = ["."]

[[bin]]
name = "esp32-node"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[features]
default = ["std", "esp-idf-svc/native"]
std = ["esp-idf-svc/binstart", "esp-idf-svc/std"]
# Bench/debug build: skips cp210x::install() and the SI-reader thread
# entirely (main.rs), so the native USB port stays in device/console mode
# for the whole session instead of cp210x::install() switching it into host
# mode partway through boot. Trades away SI-master reading for a live
# serial console across the whole boot sequence — including every
# heartbeat send, not just the boot-time Wi-Fi portal window. Also relays
# the persisted checkpoint log (persistent_log.rs) over LoRa as plain text
# frames right after the radio comes up, before anything else that could
# hang — useful when a live serial console isn't an option either (e.g.
# powering the node from a bench supply on a different machine than the one
# watching logs): the checkpoint history, including how far a previous
# stuck boot got, shows up in lora-tui/the web dashboard regardless. Build
# with:
#   cargo build --release --features debug-console
# Never enable this for a real field deployment — a node built this way
# can't read punches at all.
debug-console = []
# Brings back the boot-time Wi-Fi config portal (wifi_config.rs), disabled
# by default in favor of main.rs's ack-based auto-revert-to-standard-config
# logic — see wifi_config.rs's own doc comment. Useful for a deliberate
# one-off reconfiguration session (e.g. setting a non-default addr/dest
# before a "standard" LoRa mode boot would otherwise never get a chance to
# apply it). Build with:
#   cargo build --release --features wifi-config-portal
wifi-config-portal = []
# Swaps DIO0 completion detection (dio0_interrupt.rs) from new_with_dio0's
# plain GPIO-level polling to a genuine hardware interrupt + FreeRTOS task
# notification (sx127x::DioWait) — the CPU actually blocks/idles between
# checks instead of periodically re-reading the pin.
#
# Back to opt-in (was briefly default): a field test with this on showed
# radio.send() completing in ~10ms per call at SF11/125kHz, where a real
# CAD+TX cycle takes 280ms+ (preamble alone is ~200ms at SF11) — i.e.
# wait_high() was returning Ok(true) almost instantly instead of waiting
# for a genuine DIO0 edge, so every send silently transmitted nothing
# while reporting success (no errors logged, nothing ever reached the base
# station). Most likely a stale/latched GPIO interrupt being picked up by
# enable_interrupt() right after the DIO_MAPPING1 remap, rather than a
# fresh edge — unconfirmed, since this still can't be built/tested in the
# sandbox that wrote it (no xtensa/esp-idf toolchain there). Needs that
# root-caused and fixed before turning this back on. Build with:
#   cargo build --release --features dio0-interrupt
dio0-interrupt = []

[dependencies]
log = { version = "0.4", default-features = false }
esp-idf-svc = { version = "0.51", default-features = false }
esp-idf-hal = "0.45"
embedded-hal = "1.0"
embedded-svc = "0.28"
anyhow = "1"
libc = "0.2"

# The same no_std, embedded-hal-generic SX1276 driver lora-server runs on the
# RPi side — reused as-is, not reimplemented, so both ends speak the same
# over-the-air format by construction (see docs/superpowers/specs/2026-08-25-
# esp32-si-punch-node-design.md, "Risk 1").
sx127x = { path = "../sx127x" }

[build-dependencies]
embuild = "0.33"

# SI master station identifies as VID 0x10C4 / PID 0x800A — a Silicon Labs
# CP210x USB-to-UART bridge, not a generic USB-CDC-ACM device. The plain
# esp-idf usb_host_cdc_acm driver doesn't speak CP210x's vendor-specific
# protocol, so this pulls in Espressif's own VCP extension for it instead
# (see docs/superpowers/specs/2026-08-25-esp32-si-punch-node-design.md).
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/usb_host_cp210x_vcp", version = "2.2.0" }
bindings_header = "src/cp210x_bindings.h"
bindings_module = "cp210x"
