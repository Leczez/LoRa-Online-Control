[package]
name = "lora-cli"
version = "0.1.0"
edition = "2021"

[features]
default = []
rpi = ["dep:rppal"]

[dependencies]
sx126x = { path = "../sx126x", features = ["std"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.28"
crossterm = "0.28"
serialport = "4"
embedded-io = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
rppal = { version = "0.19", optional = true }
