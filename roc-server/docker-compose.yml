services:
  roc-server:
    build:
      context: ..
      dockerfile: roc-server/Dockerfile
      # deploy-roc-server.sh computes and exports GIT_SHA on the host
      # (where git works) before running `docker compose ... --build`;
      # compose substitutes it from that shell env here and forwards it
      # into the Dockerfile's ARG GIT_SHA. Empty/unset falls through to the
      # Dockerfile's own "unknown" default.
      args:
        GIT_SHA: "${GIT_SHA:-unknown}"
    ports:
      - "8080:8080"
    volumes:
      - roc-server-data:/data
    # Lets this container reach a native (non-Docker) process on the same
    # host via `host.docker.internal` — needed for ROC_SERVER_LORA_HEALTH_URL
    # if lora-server runs directly on this machine rather than in Docker
    # too (e.g. the planned Pi 5 setup running both services on one box).
    # Plain `localhost` inside this container refers to the container
    # itself, not the host, so that won't reach lora-server.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ROC_SERVER_LORA_HEALTH_URL: "http://host.docker.internal:8081/health"
      ROC_SERVER_LISTEN: "0.0.0.0:8080"
      # Uncomment to reject any /mip or /roc request whose competition id
      # doesn't match — must equal whatever MEOS's own Online Input dialog
      # is configured with. Left unset by default: every request is
      # accepted regardless of competition id, which is correct for a
      # single-event deployment (this server has no concept of separate
      # competitions to scope by).
      #ROC_SERVER_COMPETITION_ID: "your-competition-id"
    restart: unless-stopped

volumes:
  roc-server-data:
