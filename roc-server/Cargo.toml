[package]
name = "roc-server"
# Cargo requires a value here, but it isn't what's embedded in the binary or
# shown on /status.json — that comes from the repo-root VERSION file
# (read by build.rs) so it can't drift from what `cat VERSION` reports.
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
